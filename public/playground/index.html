// Var holds different kinds of values.
Var count = 42, ratio = 2.5, name = &quot;Ada&quot;;

// Ordinary operators work on Vars.
Var next = count + 1, full = name + &quot; Lovelace&quot;;

// Vars format themselves with %s.
printf(&quot;%s %s %s\n&quot;, next, ratio, full);

// Test Var properties at runtime.
assert(count is int &amp;&amp; ratio is double &amp;&amp; name is String);

// Types are checked statically and dynamically as needed.
int whole = count; double part = ratio;

// %d and %f also convert Vars.

ord.other.native.x2c","keyword.control.import.x2c","keyword.control.with.x2c","keyword.declaration.protocol.x2c","keyword.declaration.class.x2c","keyword.control.foreach.x2c","keyword.operator.is.x2c","storage.type.self.x2c","keyword.declaration.macro.x2c","keyword.other.macro.using.x2c","keyword.control.capture.x2c","keyword.operator.arrow.x2c"],"settings":{"foreground":"#FF4FD8","fontStyle":"bold"}},{"scope":["source.x2c punctuation.definition.literal","source.x2c punctuation.definition.interpolation","punctuation.definition.macro.sigil.x2c","punctuation.definition.macro.splice.x2c"],"settings":{"foreground":"#FF4FD8","fontStyle":"bold"}},{"scope":"support.type.prelude.x2c","settings":{"foreground":"#29D3E2","fontStyle":""}},{"scope":["storage.type.macro.result.x2c","storage.type.macro.hole.x2c"],"settings":{"foreground":"#FFB454","fontStyle":"italic"}}]}</script><script type="application/json" data-examples>[{"id":"love/values","source":"#include \u003cassert.h>\n#include \u003cmath.h>\n\nint main(void) {\n// Var holds different kinds of values.\nVar count = 42, ratio = 2.5, name = \"Ada\";\n\n// Ordinary operators work on Vars.\nVar next = count + 1, full = name + \" Lovelace\";\n\n// Vars format themselves with %s.\nprintf(\"%s %s %s\\n\", next, ratio, full);\n\n// Test Var properties at runtime.\nassert(count is int && ratio is double && name is String);\n\n// Types are checked statically and dynamically as needed.\nint whole = count; double part = ratio;\n\n// %d and %f also convert Vars.\nprintf(\"%d %f %f\\n\", count, ratio, sin(ratio));\nreturn 0;\n}\n","program":false,"visible":"#include \u003cassert.h>\n#include \u003cmath.h>\n\n// Var holds different kinds of values.\nVar count = 42, ratio = 2.5, name = \"Ada\";\n\n// Ordinary operators work on Vars.\nVar next = count + 1, full = name + \" Lovelace\";\n\n// Vars format themselves with %s.\nprintf(\"%s %s %s\\n\", next, ratio, full);\n\n// Test Var properties at runtime.\nassert(count is int && ratio is double && name is String);\n\n// Types are checked statically and dynamically as needed.\nint whole = count; double part = ratio;\n\n// %d and %f also convert Vars.\nprintf(\"%d %f %f\\n\", count, ratio, sin(ratio));","slug":"var","label":"love / values"},{"id":"love/strings","source":"#include \u003cassert.h>\n\nint main(void) {\n  String line = \"  GET /docs/guide/values.html  \";\n\n  // Slice, strip, split, and case-fold; the original is untouched.\n  String request = line.strip(NULL);\n  (String method, String path) = request.split(\" \");\n  assert(line.len() == 31 && method == \"GET\");\n\n  // Interpolate values and expressions in place.\n  String title = path.split(\"/\").last().str().replace(\".html\", \"\");\n  puts(%\"$method $title ($(path.len()) bytes)\");\n\n  // A switch on a String selects its case by content.\n  switch (method.lower()) {\n    case \"get\":  puts(\"read it\");  break;\n    case \"post\": puts(\"write it\"); break;\n    default:     puts(\"refuse it\");\n  }\n\n  // Join and repeat build text; equality is one pointer compare.\n  String rule = \"-\".repeat(3) + \" \" + \", \".join(%(\"a\" \"b\" \"c\"));\n  assert(rule == \"--- a, b, c\");\n  puts(rule);\n  return 0;\n}\n","program":false,"visible":"#include \u003cassert.h>\n\nint main(void) {\n  String line = \"  GET /docs/guide/values.html  \";\n\n  // Slice, strip, split, and case-fold; the original is untouched.\n  String request = line.strip(NULL);\n  (String method, String path) = request.split(\" \");\n  assert(line.len() == 31 && method == \"GET\");\n\n  // Interpolate values and expressions in place.\n  String title = path.split(\"/\").last().str().replace(\".html\", \"\");\n  puts(%\"$method $title ($(path.len()) bytes)\");\n\n  // A switch on a String selects its case by content.\n  switch (method.lower()) {\n    case \"get\":  puts(\"read it\");  break;\n    case \"post\": puts(\"write it\"); break;\n    default:     puts(\"refuse it\");\n  }\n\n  // Join and repeat build text; equality is one pointer compare.\n  String rule = \"-\".repeat(3) + \" \" + \", \".join(%(\"a\" \"b\" \"c\"));\n  assert(rule == \"--- a, b, c\");\n  puts(rule);\n  return 0;\n}","slug":"strings","label":"love / strings"},{"id":"love/symbols","source":"#include \u003cassert.h>\n\nint main(void) {\n// Names are values, without declaring enum constants.\nSymbol running = \u003crunning>, state = \u003cqueued>;\n\n// Symbol literals are constants, so ordinary C switch works.\nswitch (state) {\n  case \u003cqueued>:  puts(%\"$state: waiting for a worker\"); break;\n  case \u003crunning>: puts(%\"$state: doing the work\"); break;\n  default:        puts(%\"$state: no work left\");\n}\n\n// An ordered vocabulary, built entirely at compile time.\nSymbolSet stages = %\u003cqueued running done>;\nassert(stages.contains(state) && !stages.contains(\u003cfailed>));\nstate = stages[stages.index(state) + 1];\nassert(state == running);\n\n// Iterate in declared order and recover each name's text.\nforeach (Symbol stage in stages)\n  printf(\"%d: %s\\n\", stages.index(stage), stage.str());\nreturn 0;\n}\n","program":false,"visible":"#include \u003cassert.h>\n\n// Names are values, without declaring enum constants.\nSymbol running = \u003crunning>, state = \u003cqueued>;\n\n// Symbol literals are constants, so ordinary C switch works.\nswitch (state) {\n  case \u003cqueued>:  puts(%\"$state: waiting for a worker\"); break;\n  case \u003crunning>: puts(%\"$state: doing the work\"); break;\n  default:        puts(%\"$state: no work left\");\n}\n\n// An ordered vocabulary, built entirely at compile time.\nSymbolSet stages = %\u003cqueued running done>;\nassert(stages.contains(state) && !stages.contains(\u003cfailed>));\nstate = stages[stages.index(state) + 1];\nassert(state == running);\n\n// Iterate in declared order and recover each name's text.\nforeach (Symbol stage in stages)\n  printf(\"%d: %s\\n\", stages.index(stage), stage.str());","slug":"symbols","label":"love / symbols"},{"id":"love/lists","source":"#include \u003cassert.h>\n\nint main(void) {\n// Prepend in constant time, sharing the original tail.\nList prices = %(3 5 8), extended = cons(2, prices);\nassert(extended.cdr() == prices && extended == %(2 3 5 8));\n\n// Compose transformations without changing either input.\nList totals = extended.map(%!(price) => price * 2);\nList selected = totals.filter(%!(total) => total >= 10);\n\n// Unpack values, then fold them into a single result.\nVar (first, second) = selected;\nVar sum = selected.foldl(0, %!(a, b) => a + b);\nprintf(\"selected: %s + %s = %s\\n\", first, second, sum);\n\n// A literal can combine names, computed values, and nested Lists.\nputs(%(total $sum items $selected).repr());\nputs(%\"original: $(prices.repr()); extended: $(extended.repr())\");\n\n// car gets the first value; cdr gets the rest, spliced with @.\nList parts = %((first $(selected.car())) (rest @(selected.cdr())));\nputs(parts.repr());\nreturn 0;\n}\n","program":false,"visible":"#include \u003cassert.h>\n\n// Prepend in constant time, sharing the original tail.\nList prices = %(3 5 8), extended = cons(2, prices);\nassert(extended.cdr() == prices && extended == %(2 3 5 8));\n\n// Compose transformations without changing either input.\nList totals = extended.map(%!(price) => price * 2);\nList selected = totals.filter(%!(total) => total >= 10);\n\n// Unpack values, then fold them into a single result.\nVar (first, second) = selected;\nVar sum = selected.foldl(0, %!(a, b) => a + b);\nprintf(\"selected: %s + %s = %s\\n\", first, second, sum);\n\n// A literal can combine names, computed values, and nested Lists.\nputs(%(total $sum items $selected).repr());\nputs(%\"original: $(prices.repr()); extended: $(extended.repr())\");\n\n// car gets the first value; cdr gets the rest, spliced with @.\nList parts = %((first $(selected.car())) (rest @(selected.cdr())));\nputs(parts.repr());","slug":"lists","label":"love / lists"},{"id":"love/arrays","source":"#include \u003cassert.h>\n\nint main(void) {\n// Grow and update a sequence in place.\nArray scores = [7, 3, 9];\nscores.push(5); scores[1] += 1;\n\n// Sorting mutates; copy first to keep the original order.\nArray ranked = scores.copy().sort().reverse();\nassert(scores == [7, 4, 9, 5] && scores !== ranked);\n\n// Slices and map create new Arrays.\nArray top = ranked[:2];\nArray boosted = top.map(%!(score) => score + 1);\nVar total = boosted.foldl(0, %!(a, b) => a + b);\nprintf(\"scores: %s; ranked: %s\\n\", scores.repr(), ranked.repr());\n\n// Use indexed access or iterate over the resulting values.\nforeach (int score in boosted)\n  printf(\"%d \", score);\nprintf(\"=> total %s, best %s\\n\", total, boosted[0]);\nreturn 0;\n}\n","program":false,"visible":"#include \u003cassert.h>\n\n// Grow and update a sequence in place.\nArray scores = [7, 3, 9];\nscores.push(5); scores[1] += 1;\n\n// Sorting mutates; copy first to keep the original order.\nArray ranked = scores.copy().sort().reverse();\nassert(scores == [7, 4, 9, 5] && scores !== ranked);\n\n// Slices and map create new Arrays.\nArray top = ranked[:2];\nArray boosted = top.map(%!(score) => score + 1);\nVar total = boosted.foldl(0, %!(a, b) => a + b);\nprintf(\"scores: %s; ranked: %s\\n\", scores.repr(), ranked.repr());\n\n// Use indexed access or iterate over the resulting values.\nforeach (int score in boosted)\n  printf(\"%d \", score);\nprintf(\"=> total %s, best %s\\n\", total, boosted[0]);","slug":"arrays","label":"love / arrays"},{"id":"love/maps","source":"int main(void) {\n// Start with named items and their stock quantities.\nMap stock = {\"tea\": 12, \"coffee\": 8, \"milk\": 6, \"sugar\": 0};\n\n// Update existing entries or add new ones with the same syntax.\nstock[\"tea\"] -= 2;\nstock[\"coffee\"] += 5;\nstock[\"cocoa\"] = 4;\n\n// Fetch a value directly, or supply a fallback without inserting.\nprintf(\"tea: %s; biscuits: %s\\n\",\n  stock[\"tea\"],\n  stock.getdefault(\"biscuits\", 0));\n\n// A stored zero is different from an absent key.\nVar sugar;\nif (stock.try_get(\"sugar\", sugar))\n  puts(%\"sugar is stocked: $sugar remaining\");\n\n// Sort the keys to visit each value in a predictable order.\nArray items = auto stock.keys().array().sort();\nforeach (String item in items)\n  puts(%\"$item: $(stock[item])\");\nreturn 0;\n}\n","program":false,"visible":"// Start with named items and their stock quantities.\nMap stock = {\"tea\": 12, \"coffee\": 8, \"milk\": 6, \"sugar\": 0};\n\n// Update existing entries or add new ones with the same syntax.\nstock[\"tea\"] -= 2;\nstock[\"coffee\"] += 5;\nstock[\"cocoa\"] = 4;\n\n// Fetch a value directly, or supply a fallback without inserting.\nprintf(\"tea: %s; biscuits: %s\\n\",\n  stock[\"tea\"],\n  stock.getdefault(\"biscuits\", 0));\n\n// A stored zero is different from an absent key.\nVar sugar;\nif (stock.try_get(\"sugar\", sugar))\n  puts(%\"sugar is stocked: $sugar remaining\");\n\n// Sort the keys to visit each value in a predictable order.\nArray items = auto stock.keys().array().sort();\nforeach (String item in items)\n  puts(%\"$item: $(stock[item])\");","slug":"maps","label":"love / maps"},{"id":"love/literals","source":"#include \u003cassert.h>\nint main(void) {\nMap workshop = {\n  title: \"Make a tiny game\",\n  topics: %(graphics sound games),\n  venue: {\n    name: \"The Maker House\", room: \"Studio 2\", seats: 24,\n    address: { street: \"12 Garden Lane\", city: \"Bristol\" }\n  },\n  hosts: [\n    { name: \"Ada\", role: \u003cinstructor>, skills: %(graphics games) },\n    { name: \"Sam\", role: \u003cmentor>, skills: %(music sound) }\n  ],\n  pricing: { currency: \"GBP\", standard: 35.0, student: 15.0 },\n  bring: [\"A laptop\", \"Headphones\", \"An unfinished idea\"],\n  sessions: [\n    { title: \"Draw a world\", minutes: 45,\n      project: { width: 320, height: 240, colors: 16 } },\n    { title: \"Make it move\", minutes: 60,\n      controls: { left: \u003ca>, right: \u003cd>, jump: \u003cspace> } },\n 2);\nassert(point.x == 1 && point.y == 2);\npoint.move(3, 4);\nassert(point.x == 4 && point.y == 6);\nreturn 0;\n}\n\n// Allocate a Point in the current Scope.\nPoint Point.new(int x, int y) {\n  Point point = xmalloc(sizeof(struct Point));\n  point.x = x; point.y = y;\n  return point;\n}\n\n// Fields and methods both use dot notation.\nvoid Point.move(Point point, int dx, int dy) {\n  point.x += dx; point.y += dy;\n}\n","program":false,"visible":"// Define a type with its own named methods.\ntypedef struct Point { int x, y; } *Point;\n\n// Create and move a Point with compact dot calls.\nPoint point = Point.new(1, 2);\npoint.move(3, 4);\n\n// Allocate a Point in the current Scope.\nPoint Point.new(int x, int y) {\n  Point point = xmalloc(sizeof(struct Point));\n  point.x = x; point.y = y;\n  return point;\n}\n\n// Fields and methods both use dot notation.\nvoid Point.move(Point point, int dx, int dy) {\n  point.x += dx; point.y += dy;\n}","slug":"methods","label":"love / methods"},{"id":"magic/operators","source":"#include \u003cassert.h>\n// Reuse Map storage: its keys are the set members.\ntypedef Map Set;\n\nint main(void) {\n// Create two sets, then take their union and intersection.\nSet fruit = Set.new(%(apple pear));\nSet lunch = Set.new(%(pear bread));\nSet set_union = fruit + lunch;\nSet intersection = fruit * lunch;\nprintf(\"union: %s\\n\", set_union.keys().list().sort().repr());\nprintf(\"intersection: %s\\n\", intersection.keys().list().sort().repr());\nassert(set_union.len() == 3 && set_union.contains(\u003capple>) &&\n       set_union.contains(\u003cpear>) && set_union.contains(\u003cbread>));\nassert(fruit.len() == 2 && lunch.len() == 2);\nassert(Set.new(nil).len() == 0);\nassert(Set.new(%(apple pear apple)).len() == 2);\nassert(intersection.len() == 1 && intersection.contains(\u003cpear>));\nassert((fruit * fruit).len() == 2);\nassert((fruit * Set.new(nil)).len() == 0);\nassert((Set.new(nil) * fruit).len() == 0);\nassert(fruit.len() == 2 && lunch.len() == 2);\nreturn 0;\n}\n\nSet Set.add(Set left, Set right) => left.copy().merge(right);\nSet Set.mul(Set left, Set right) => Set.new(left.keys()\n  .filter(%!(Var key) => key in right));\nSet Set.new(List keys) => keys.foldl(%{},\n  %!(Map set, Var key) => set.update_n(1, key, (Var) 1));\n\n// Connect add and mul to the + and * operators.\nprotocol Map(T) { T T.add(T, T); T T.mul(T, T); }\nprotocol Map(Set);\n","program":false,"visible":"// Reuse Map storage: its keys are the set members.\ntypedef Map Set;\n\n// Create two sets, then take their union and intersection.\nSet fruit = Set.new(%(apple pear));\nSet lunch = Set.new(%(pear bread));\nSet set_union = fruit + lunch;\nSet intersection = fruit * lunch;\n\nSet Set.add(Set left, Set right) => left.copy().merge(right);\nSet Set.mul(Set left, Set right) => Set.new(left.keys()\n  .filter(%!(Var key) => key in right));\nSet Set.new(List keys) => keys.foldl(%{},\n  %!(Map set, Var key) => set.update_n(1, key, (Var) 1));\n\n// Connect add and mul to the + and * operators.\nprotocol Map(T) { T T.add(T, T); T T.mul(T, T); }\nprotocol Map(Set);","slug":"operators","label":"magic / operators"},{"id":"magic/macros","source":"#include \u003cassert.h>\nmacro Stmt $swap(Expr $left, Expr $right) {\n  $Code.type($left) temporary = $left;\n  $left = $right;\n  $right = temporary;\n}\n\nint main(void) {\n// The same macro works with different types.\nint left = 20, right = 22;\n$swap(left, right);\n\nString first = \"hello\", last = \"world\";\n$swap(first, last);\nprintf(\"%d %d; %s %s\\n\", left, right, first, last);\nassert(left == 22 && right == 20);\nassert(first == \"world\" && last == \"hello\");\nreturn 0;\n}\n","program":false,"visible":"macro Stmt $swap(Expr $left, Expr $right) {\n  $Code.type($left) temporary = $left;\n  $left = $right;\n  $right = temporary;\n}\n\n// The same macro works with different types.\nint left = 20, right = 22;\n$swap(left, right);\n\nString first = \"hello\", last = \"world\";\n$swap(first, last);\nprintf(\"%d %d; %s %s\\n\", left, right, first, last);","slug":"macros","label":"magic / macros"},{"id":"magic/decorators","source":"#include \u003cassert.h>\nmacro Decorator $trace(Function $function) {\n  printf(\"enter %s\\n\", $Code.name($function));\n  defer printf(\"leave %s\\n\", $Code.name($function));\n  @Code.body($function)\n}\n\nint main(void) {\n// Prints \"enter answer\", then \"leave answer\".\nint result = answer();\nassert(result == 42);\nreturn 0;\n}\n\n$trace()\nint answer(void) => 42;\n","program":false,"visible":"macro Decorator $trace(Function $function) {\n  printf(\"enter %s\\n\", $Code.name($function));\n  defer printf(\"leave %s\\n\", $Code.name($function));\n  @Code.body($function)\n}\n\n// Prints \"enter answer\", then \"leave answer\".\nint result = answer();\n\n$trace()\nint answer(void) => 42;","slug":"decorators","label":"magic / decorators"},{"id":"magic/keywords","source":"#include \u003cassert.h>\nmacro Decorator $control.with_lock(Stmt $body, Expr $lock) { {\n    Mutex held = $lock;\n    held.lock();\n    defer held.unlock();\n    $body\n  } }\n\nkeyword with_lock $control.with_lock;\n\nint main(void) {\nauto Mutex mutex = Mutex.new();\ntry with_lock(mutex) { raise %(oops); }\ncatch %(oops):\n{\nassert(mutex.try_lock());\nmutex.unlock();\n  puts(\"caught, and the lock is already free\");\n}\nreturn 0;\n}\n","program":false,"visible":"macro Decorator $control.with_lock(Stmt $body, Expr $lock) { {\n    Mutex held = $lock;\n    held.lock();\n    defer held.unlock();\n    $body\n  } }\n\nkeyword with_lock $control.with_lock;\n\nauto Mutex mutex = Mutex.new();\ntry with_lock(mutex) { raise %(oops); }\ncatch %(oops):\n  puts(\"caught, and the lock is already free\");","slug":"keywords","label":"magic / keywords"},{"id":"magic/compile-time","source":"#include \u003cassert.h>\n\nstatic const int codes[] = $column(0);\n\nint main(void) {\nString labels[] = $column(1);\n\n// The generated program uses ordinary C arrays.\nfor (size_t i = 0; i \u003c sizeof(codes) / sizeof(*codes); i++)\n  printf(\"%d: %s\\n\", codes[i], labels[i]);\nassert(codes[1] == 404 && labels[1] == \"Not Found\");\nreturn 0;\n}\n\n// The compiler runs `column` and inserts a C initializer built from the table.\nmeta static List column(int n) {\n  Array cells = [];\n  foreach (List row in responses()) cells.push(row[n]);\n  List items = cells.list_free();\n  return $!( { @items } );\n}\n\n// One table supplies both wire codes and readable labels.\nmeta static List responses(void) =>\n  %((200 \"OK\") (404 \"Not Found\") (503 \"Unavailable\"));\n","program":false,"visible":"static const int codes[] = $column(0);\n\nString labels[] = $column(1);\n\n// The generated program uses ordinary C arrays.\nfor (size_t i = 0; i \u003c sizeof(codes) / sizeof(*codes); i++)\n  printf(\"%d: %s\\n\", codes[i], labels[i]);\n\n// The compiler runs `column` and inserts a C initializer built from the table.\nmeta static List column(int n) {\n  Array cells = [];\n  foreach (List row in responses()) cells.push(row[n]);\n  List items = cells.list_free();\n  return $!( { @items } );\n}\n\n// One table supplies both wire codes and readable labels.\nmeta static List responses(void) =>\n  %((200 \"OK\") (404 \"Not Found\") (503 \"Unavailable\"));","slug":"compile-time-lisp","label":"magic / compile-time"},{"id":"magic/runtime","source":"#include \u003cassert.h>\nint main(void) {\n// Expose an ordinary typed function to the runtime interpreter.\nauto Lisp lisp = Lisp.new();\n$lisp.bind(lisp, \"seats-left\", seats_left);\n\n// Keep the party together, or admit as many people as fit.\nList together = %(lambda (plan n)\n  (if (\u003c= n (seats-left plan)) n 0));\nList split = %(lambda (plan n)\n  (if (\u003c= n (seats-left plan)) n (seats-left plan)));\n\n// Supply either policy as data to the same evaluator.\nint whole = lisp.eval($(together, \"free\", 12));\nint partial = lisp.eval($(split, \"free\", 12));\nprintf(\"together: %d; split: %d\\n\", whole, partial);\nassert(whole == 0 && partial == 2);\nreturn 0;\n}\n\nint seats_left(String plan) => plan == \"pro\" ? 25 : 2;\n","program":false,"visible":"// Expose an ordinary typed function to the runtime interpreter.\nauto Lisp lisp = Lisp.new();\n$lisp.bind(lisp, \"seats-left\", seats_left);\n\n// Keep the party together, or admit as many people as fit.\nList together = %(lambda (plan n)\n  (if (\u003c= n (seats-left plan)) n 0));\nList split = %(lambda (plan n)\n  (if (\u003c= n (seats-left plan)) n (seats-left plan)));\n\n// Supply either policy as data to the same evaluator.\nint whole = lisp.eval($(together, \"free\", 12));\nint partial = lisp.eval($(split, \"free\", 12));\nprintf(\"together: %d; split: %d\\n\", whole, partial);\n\nint seats_left(String plan) => plan == \"pro\" ? 25 : 2;","slug":"runtime-lisp","label":"magic / runtime"},{"id":"magic/ways-to-agree","source":"#include \u003cassert.h>\n\nint main(void) {\nList comptime = $squares(3);\n\n// A literal compiles to a form similar to the cons cells below.\nList literal = %(1 4 9);\n\n// Explicit construction reveals the underlying C functions.\nList constructed = cons(int_var(1),\n  cons(int_var(4), cons(int_var(9), NULL)));\n\n// Runtime Lisp will build it on the fly.\nauto Lisp lisp = Lisp.new();\nList runtime = lisp.eval(%(list (* 1 1) (* 2 2) (* 3 3)));\n\nList ways = $(comptime, literal, constructed, runtime);\nforeach (List left in ways)\n  foreach (List right in ways) assert(left == right);\nassert(comptime == literal && literal == constructed &&\n       constructed == runtime);\nputs(\"All four lists are equal.\");\nreturn 0;\n}\n\n// A meta function computes the List during translation.\nmeta static List squares(int n) {\n  Array items = [];\n  for (int i = 1; i \u003c= n; i++) items.push(i * i);\n  return items.list_free();\n}\n","program":false,"visible":"List comptime = $squares(3);\n\n// A literal compiles to a form similar to the cons cells below.\nList literal = %(1 4 9);\n\n// Explicit construction reveals the underlying C functions.\nList constructed = cons(int_var(1),\n  cons(int_var(4), cons(int_var(9), NULL)));\n\n// Runtime Lisp will build it on the fly.\nauto Lisp lisp = Lisp.new();\nList runtime = lisp.eval(%(list (* 1 1) (* 2 2) (* 3 3)));\n\nassert(comptime == literal && literal == constructed &&\n       constructed == runtime);\nputs(\"All four lists are equal.\");\n\n// A meta function computes the List during translation.\nmeta static List squares(int n) {\n  Array items = [];\n  for (int i = 1; i \u003c= n; i++) items.push(i * i);\n  return items.list_free();\n}","slug":"ways-to-agree","label":"magic / ways-to-agree"},{"id":"power/indexing","source":"#include \u003cassert.h>\n// Store documents once; words refer to them by ID.\ntypedef struct Index { Array documents; Map words; } *Index;\n\nint main(void) {\nIndex index = Index.new();\nindex.add(\"garden\", \"red roses red tulips\");\nindex.add(\"kitchen\", \"red apples green pears\");\nassert(index.find(\"RED\") == [0, 1]);\nassert(index.find(\"roses\") == [0]);\nint words = index.words.len();\nassert(index.find(\"blue\").len() == 0 && index.words.len() == words);\nArray matches = index.find(\"roses\");\nputs(%\"roses: $(index.documents[matches[0]])\");\nreturn 0;\n}\n\nIndex Index.new(void) {\n  Index index = xmalloc(sizeof(struct Index));\n  index.documents = []; index.words = {};\n  return index;\n}\n\n// Add each word once per document, regardless of case or repetition.\nvoid Index.add(Index index, String name, String text) {\n  int id = index.documents.len();\n  index.documents.push(name);\n  foreach (String word in text.lower().words().iter().unique())\n    index.words.setdefault(word, []).array().push(id);\n}\n\n// An unknown word has no matches; lookup does not change the index.\nArray Index.find(Index index, String word)\n  => index.words.getdefault(word.lower(), []);\n","program":false,"visible":"// Store documents once; words refer to them by ID.\ntypedef struct Index { Array documents; Map words; } *Index;\n\n\nIndex Index.new(void) {\n  Index index = xmalloc(sizeof(struct Index));\n  index.documents = []; index.words = {};\n  return index;\n}\n\n// Add each word once per document, regardless of case or repetition.\nvoid Index.add(Index index, String name, String text) {\n  int id = index.documents.len();\n  index.documents.push(name);\n  foreach (String word in text.lower().words().iter().unique())\n    index.words.setdefault(word, []).array().push(id);\n}\n\n// An unknown word has no matches; lookup does not change the index.\nArray Index.find(Index index, String word)\n  => index.words.getdefault(word.lower(), []);","slug":"indexing","label":"power / indexing"},{"id":"power/scopes","source":"/* Allocation counts are zero unless X2C_SCOPE_ACCOUNTING=1 is set, so the\n   assertions that expect live allocations check only with accounting. */\n#include \u003cassert.h>\nint main(void) {\n// Prepare the catch before measuring reclaimable working storage.\nfail_in_scope();\nsize_t before = Scope.stats().live_allocations;\n// Reclaim working storage regularly in a long-running survey.\nsize_t total = 0;\n// Each day's file list lives until that survey finishes.\nwhile (wait_for_day()) auto {\n  assert(Scope.stats().live_allocations == before);\n  Array files = survey_files();\n  size_t daily = Scope.stats().live_allocations;\n\n  // Working data is reclaimed after every file.\n  foreach (String path in files) auto {\n    assert(Scope.stats().live_allocations == daily);\n    Map findings = inspect_file(path);\n    save_findings(path, findings);\n    assert(!Scope.accounting_enabled() ||\n           Scope.stats().live_allocations > daily);\n    total++;\n  }\n  assert(Scope.stats().live_allocations == daily);\n}\nprintf(\"processed: %zu files\\n\", total);\nassert(total == 4 && Scope.stats().live_allocations == before);\nassert(return_early() == 2);\nassert(Scope.stats().live_allocations == before);\nfail_in_scope();\nassert(Scope.stats().live_allocations == before);\nreturn 0;\n}\n\nint wait_for_day(void) { static int days = 0; return days++ \u003c 2; }\n\nvoid save_findings(String path, Map findings) {\n  Array sizes = findings[\u003csizes>];\n  assert(sizes[0] == 12 && findings[\u003cerrors>] == 0);\n}\n\nauto int return_early(void) {\n  Array files = survey_files();\n  return files.length;\n}\n\nArray survey_files(void) => [\"first.dat\", \"second.dat\"];\n\nvoid fail_in_scope(void) {\n  size_t before = Scope.stats().live_allocations;\n  try auto {\n    Map findings = inspect_file(\"failure.dat\");\n    assert(!Scope.accounting_enabled() ||\n           Scope.stats().live_allocations > before);\n    raise %(oops);\n  }\n  catch %(oops): {}\n}\n\nMap inspect_file(String path) => {sizes: [12, 24], errors: 0};\n","program":false,"visible":"// Reclaim working storage regularly in a long-running survey.\nsize_t total = 0;\n// Each day's file list lives until that survey finishes.\nwhile (wait_for_day()) auto {\n  Array files = survey_files();\n\n  // Working data is reclaimed after every file.\n  foreach (String path in files) auto {\n    Map findings = inspect_file(path);\n    save_findings(path, findings);\n    total++;\n  }\n}\nprintf(\"processed: %zu files\\n\", total);","slug":"scopes","label":"power / scopes"},{"id":"power/match","source":"#include \u003cassert.h>\nint main(void) {\nList code = %(block\n  (if (not ready) (call wait) (call start))\n  (if true (call save) (call discard)));\nputs(simplify(code).repr());\n// (block (if ready (call start) (call wait)) (call save))\nassert(simplify(code) ==\n       %(block (if ready (call start) (call wait)) (call save)));\nassert(simplify(%(if false (call wrong) (call right))) == %(call right));\nassert(simplify(%(if (not true) (call wrong) (call right))) == %(call right));\nassert(simplify(%(if ready (if true (call yes) (call wrong))\n                          (if false (call wrong) (call no)))) ==\n       %(if ready (call yes) (call no)));\nassert(simplify(%(block)) == %(block));\nassert(simplify(%(call untouched)) == %(call untouched));\nreturn 0;\n}\n\n// Recognize a nested condition and exchange its branches.\nList simplify(List node) {\n  match (node) {\n    case %(if (not ?condition) ?yes ?no):\n      return simplify(%(if $condition $no $yes));\n    case %(if true ?yes ?): return simplify(yes);\n    case %(if false ? ?no): return simplify(no);\n    case %(if ?condition ?yes ?no):\n      return %(if $condition $(simplify(yes)) $(simplify(no)));\n    // Capture a whole block, transform it, splice it back in.\n    case %(block *body):\n      return %(block @(body.map(%!(List item) => simplify(item))));\n    default: return node;\n  }\n}\n","program":false,"visible":"List code = %(block\n  (if (not ready) (call wait) (call start))\n  (if true (call save) (call discard)));\nputs(simplify(code).repr());\n// (block (if ready (call start) (call wait)) (call save))\n\n// Recognize a nested condition and exchange its branches.\nList simplify(List node) {\n  match (node) {\n    case %(if (not ?condition) ?yes ?no):\n      return simplify(%(if $condition $no $yes));\n    case %(if true ?yes ?): return simplify(yes);\n    case %(if false ? ?no): return simplify(no);\n    case %(if ?condition ?yes ?no):\n      return %(if $condition $(simplify(yes)) $(simplify(no)));\n    // Capture a whole block, transform it, splice it back in.\n    case %(block *body):\n      return %(block @(body.map(%!(List item) => simplify(item))));\n    default: return node;\n  }\n}","slug":"match","label":"power / match"},{"id":"power/exceptions","source":"#include \u003cassert.h>\n#include \"path.x\"\n#include \u003cfcntl.h>\n#include \u003cerrno.h>\nstatic int opened_fd = -1;\nint main(int argc, char **argv) {\nString directory = argc > 1 ? argv[1]\n                           : example_data(\"power-exceptions\");\nassert(preview(%\"$directory/document.txt\") == \"Meeting at noon.\");\nassert(fcntl(opened_fd, F_GETFD) == -1 && errno == EBADF);\n// document.bin contains a NUL byte, which String cannot hold.\nputs(preview(%\"$directory/document.bin\"));\nassert(fcntl(opened_fd, F_GETFD) == -1 && errno == EBADF);\nassert(preview(%\"$directory/missing-preview-file.txt\")\n       == \"No preview: file not found.\");\nassert(preview(directory) == \"No preview: unable to read file.\");\nassert(fcntl(opened_fd, F_GETFD) == -1 && errno == EBADF);\nreturn 0;\n}\n\n// The caller decides how to present content that cannot be text.\nString preview(String path) {\n  try return read_text(path);\n  catch %(bad-arg *):\n{\nassert(fcntl(opened_fd, F_GETFD) == -1 && errno == EBADF);\n    return \"No text preview: file contains a NUL byte.\";\n}\n  catch %(not-found *):\n    return \"No preview: file not found.\";\n  catch:\n    return \"No preview: unable to read file.\";\n}\n\n// Close the file on success or while unwinding from a failed read.\nString read_text(String path) {\n  auto File input = path.open(\"r\");\nopened_fd = input.fileno();\n  return input.string();\n}\n\n// The checked-in data sits beside the examples wherever they live.\nString example_data(String name) {\n  Path source = String.new(__FILE__);\n  return source.dirname().join(\"../data\").join(name);\n}\n","program":false,"visible":"String directory = argc > 1 ? argv[1]\n                           : example_data(\"power-exceptions\");\n// document.bin contains a NUL byte, which String cannot hold.\nputs(preview(%\"$directory/document.bin\"));\n\n// The caller decides how to present content that cannot be text.\nString preview(String path) {\n  try return read_text(path);\n  catch %(bad-arg *):\n    return \"No text preview: file contains a NUL byte.\";\n  catch %(not-found *):\n    return \"No preview: file not found.\";\n  catch:\n    return \"No preview: unable to read file.\";\n}\n\n// Close the file on success or while unwinding from a failed read.\nString read_text(String path) {\n  auto File input = path.open(\"r\");\n  return input.string();\n}","slug":"exceptions","label":"power / exceptions"},{"id":"power/generics","source":"#include \u003cassert.h>\n// Opt into the ready-made typed collection families.\n#include \"typed-array.x\"\n#include \"typed-map.x\"\n#include \"typed-list.x\"\n\nint main(void) {\n// Store native ints and count each response code.\nArrayInt responses = [200, 200, 404, 200, 500, 404];\nMapIntInt counts = {};\nfor (int i = 0, n = responses.len(); i \u003c n; i++)\n  counts[responses[i]] += 1;\n\n// A typed List fixes the report order, including absent codes.\nListInt codes = %(200 403 404 500);\nfor (ListInt rest = codes; rest; rest = rest.cdr()) {\n  int code = rest.car();\n  printf(\"%d: %d\\n\", code, counts.getdefault(code, 0));\n}\nassert(counts[200] == 3 && counts[404] == 2);\nassert(counts[500] == 1 && counts.getdefault(403, 0) == 0);\nassert(counts.len() == 3 && responses.len() == 6);\nassert(codes.car() == 200 && codes.last() == 500);\nreturn 0;\n}\n","program":false,"visible":"// Opt into the ready-made typed collection families.\n#include \"typed-array.x\"\n#include \"typed-map.x\"\n#include \"typed-list.x\"\n\n// Store native ints and count each response code.\nArrayInt responses = [200, 200, 404, 200, 500, 404];\nMapIntInt counts = {};\nfor (int i = 0, n = responses.len(); i \u003c n; i++)\n  counts[responses[i]] += 1;\n\n// A typed List fixes the report order, including absent codes.\nListInt codes = %(200 403 404 500);\nfor (ListInt rest = codes; rest; rest = rest.cdr()) {\n  int code = rest.car();\n  printf(\"%d: %d\\n\", code, counts.getdefault(code, 0));\n}","slug":"generics","label":"power / generics"},{"id":"love/two-kinds","source":"#include \u003cassert.h>\n\nint main(void) {\n  // Values: equal content is the same object, so == is a pointer compare.\n  String greeting = \"hel\" + \"lo\", word = \"hello\";\n  List pair = %(1 2), twin = cons(1, cons(2, NULL));\n  assert(greeting == word && pair == twin && pair === twin);\n\n  // Objects: Arrays and Maps have identity; copies of the handle share it.\n  Array scores = [7, 3, 9], same = scores, other = [7, 3, 9];\n  assert(scores == other && scores !== other);\n  same.push(5);\n  assert(scores == same && scores === same);\n  assert(scores != other && scores !== other);\n\n  // Equal Strings and Lists find the same Map entry.\n  Map seen = {(greeting): 1, (pair): 2, done: other.len()};\n  printf(\"%s %s %s\\n\", seen[\"hello\"], seen[%(1 2)], seen[\u003cdone>]);\n  return 0;\n}\n","program":false,"visible":"#include \u003cassert.h>\n\nint main(void) {\n  // Values: equal content is the same object, so == is a pointer compare.\n  String greeting = \"hel\" + \"lo\", word = \"hello\";\n  List pair = %(1 2), twin = cons(1, cons(2, NULL));\n  assert(greeting == word && pair == twin && pair === twin);\n\n  // Objects: Arrays and Maps have identity; copies of the handle share it.\n  Array scores = [7, 3, 9], same = scores, other = [7, 3, 9];\n  assert(scores == other && scores !== other);\n  same.push(5);\n  assert(scores == same && scores === same);\n  assert(scores != other && scores !== other);\n\n  // Equal Strings and Lists find the same Map entry.\n  Map seen = {(greeting): 1, (pair): 2, done: other.len()};\n  printf(\"%s %s %s\\n\", seen[\"hello\"], seen[%(1 2)], seen[\u003cdone>]);\n  return 0;\n}","slug":"two-kinds","label":"love / two-kinds"},{"id":"love/collections","source":"#include \u003cassert.h>\n\nint main(void) {\n  // Lists are immutable and share structure; cons is constant time.\n  List prices = %(3 5 8), extended = cons(2, prices);\n  List doubled = extended.map(%!(price) => price * 2);\n  assert(extended.cdr() == prices && doubled == %(4 6 10 16));\n\n  // Arrays grow and mutate in place; copy first to keep the original.\n  Array scores = [7, 3, 9];\n  scores.push(5);\n  Array ranked = scores.copy().sort().reverse();\n  assert(scores == [7, 3, 9, 5] && ranked[:2] == [9, 7]);\n\n  // Maps grow on write and tell absence from a stored zero.\n  Map stock = {tea: 12, sugar: 0};\n  stock[\u003ctea>] -= 2;\n  stock[\u003ccocoa>] = 4;\n  Var sugar;\n  assert(stock.try_get(\u003csugar>, sugar) && sugar == 0);\n  assert(stock.getdefault(\u003cmilk>, -1) == -1 && !stock.contains(\u003cmilk>));\n  printf(\"%s %s %s\\n\", doubled.repr(), ranked.repr(), stock[\u003ctea>]);\n  return 0;\n}\n","program":false,"visible":"#include \u003cassert.h>\n\nint main(void) {\n  // Lists are immutable and share structure; cons is constant time.\n  List prices = %(3 5 8), extended = cons(2, prices);\n  List doubled = extended.map(%!(price) => price * 2);\n  assert(extended.cdr() == prices && doubled == %(4 6 10 16));\n\n  // Arrays grow and mutate in place; copy first to keep the original.\n  Array scores = [7, 3, 9];\n  scores.push(5);\n  Array ranked = scores.copy().sort().reverse();\n  assert(scores == [7, 3, 9, 5] && ranked[:2] == [9, 7]);\n\n  // Maps grow on write and tell absence from a stored zero.\n  Map stock = {tea: 12, sugar: 0};\n  stock[\u003ctea>] -= 2;\n  stock[\u003ccocoa>] = 4;\n  Var sugar;\n  assert(stock.try_get(\u003csugar>, sugar) && sugar == 0);\n  assert(stock.getdefault(\u003cmilk>, -1) == -1 && !stock.contains(\u003cmilk>));\n  printf(\"%s %s %s\\n\", doubled.repr(), ranked.repr(), stock[\u003ctea>]);\n  return 0;\n}","slug":"collections","label":"love / collections"},{"id":"love/loops","source":"#include \u003cassert.h>\n\nint main(void) {\n  Array orders = [%(tea 2 \"Ada\"), %(coffee 1 \"Grace\"), %(tea 1 \"Linus\")];\n\n  // foreach walks anything with elements; destructure as you go.\n  foreach (List order in orders) {\n    (Symbol item, int count, String who) = order;\n    printf(\"%s wants %d %s\\n\", who, count, item.str());\n  }\n\n  // A pattern condition binds names right where you test them.\n  foreach (List order in orders)\n    if (order ~= %(tea ?(int n) ?(String who)) && n > 1)\n      puts(%\"$who is thirsty\");\n\n  // Lambdas and iterator chains read left to right.\n  Var total = orders.iter().map(%!(List order) => order[1])\n    .foldl(0, %!(sum, count) => sum + count);\n  assert(total == 4);\n\n  return 0;\n}\n","program":false,"visible":"#include \u003cassert.h>\n\nint main(void) {\n  Array orders = [%(tea 2 \"Ada\"), %(coffee 1 \"Grace\"), %(tea 1 \"Linus\")];\n\n  // foreach walks anything with elements; destructure as you go.\n  foreach (List order in orders) {\n    (Symbol item, int count, String who) = order;\n    printf(\"%s wants %d %s\\n\", who, count, item.str());\n  }\n\n  // A pattern condition binds names right where you test them.\n  foreach (List order in orders)\n    if (order ~= %(tea ?(int n) ?(String who)) && n > 1)\n      puts(%\"$who is thirsty\");\n\n  // Lambdas and iterator chains read left to right.\n  Var total = orders.iter().map(%!(List order) => order[1])\n    .foldl(0, %!(sum, count) => sum + count);\n  assert(total == 4);\n\n  return 0;\n}","slug":"loops","label":"love / loops"},{"id":"power/classes","source":"#include \u003cassert.h>\n\n// A value class: construction, equality, hashing, and printing come free.\nclass Point { int x; int y; };\n\n// A pointer class with your own init; new allocates in the current Scope.\nclass Account { String owner; long cents; } *;\n\nvoid Account.init(Account account, String owner) {\n  account.owner = owner;\n  account.cents = 0;\n}\n\nvoid Account.deposit(Account account, long cents) => account.cents += cents;\nString Account.repr(Account account) =>\n  %\"Account($(account.owner), $(account.cents) cents)\";\n\nint main(void) {\n  Point here = Point.new(3, 4), there = Point.new(3, 4);\n  assert(here == there);\n  Map labels = {};\n  labels[here] = \"home\";\n  printf(\"%s is %s\\n\", there.repr(), labels[there]);\n\n  Account ada = auto Account.new(\"Ada\");\n  ada.deposit(1250);\n  ada.deposit(75);\n  printf(\"%s\\n\", ada.repr());\n  return 0;\n}\n","program":false,"visible":"#include \u003cassert.h>\n\n// A value class: construction, equality, hashing, and printing come free.\nclass Point { int x; int y; };\n\n// A pointer class with your own init; new allocates in the current Scope.\nclass Account { String owner; long cents; } *;\n\nvoid Account.init(Account account, String owner) {\n  account.owner = owner;\n  account.cents = 0;\n}\n\nvoid Account.deposit(Account account, long cents) => account.cents += cents;\nString Account.repr(Account account) =>\n  %\"Account($(account.owner), $(account.cents) cents)\";\n\nint main(void) {\n  Point here = Point.new(3, 4), there = Point.new(3, 4);\n  assert(here == there);\n  Map labels = {};\n  labels[here] = \"home\";\n  printf(\"%s is %s\\n\", there.repr(), labels[there]);\n\n  Account ada = auto Account.new(\"Ada\");\n  ada.deposit(1250);\n  ada.deposit(75);\n  printf(\"%s\\n\", ada.repr());\n  return 0;\n}","slug":"classes","label":"power / classes"},{"id":"power/protocols","source":"#include \u003cassert.h>\n// Reuse Map storage: its keys are the set members.\ntypedef Map Set;\n\nint main(void) {\n  // Create two sets, then take their union and intersection.\n  Set fruit = Set.new(%(apple pear));\n  Set lunch = Set.new(%(pear bread));\n  Set set_union = fruit + lunch;\n  Set intersection = fruit * lunch;\n  assert(set_union.len() == 3 && set_union.contains(\u003capple>) &&\n         set_union.contains(\u003cpear>) && set_union.contains(\u003cbread>));\n  assert(fruit.len() == 2 && lunch.len() == 2);\n  assert(Set.new(nil).len() == 0);\n  assert(Set.new(%(apple pear apple)).len() == 2);\n  Set symbols = Set.new(%(apple pear));\n  assert(symbols.contains(\u003capple>) && symbols.contains(\u003cpear>));\n  assert(intersection.len() == 1 && intersection.contains(\u003cpear>));\n  assert((fruit * fruit).len() == 2);\n  assert((fruit * Set.new(nil)).len() == 0);\n  assert((Set.new(nil) * fruit).len() == 0);\n  assert(fruit.len() == 2 && lunch.len() == 2);\n  printf(\"%d in the union, %d in both\\n\", set_union.len(), intersection.len());\n  return 0;\n}\n\nSet Set.add(Set left, Set right) => left.copy().merge(right);\nSet Set.mul(Set left, Set right) => Set.new(left.keys()\n  .filter(%!(Var key) => key in right));\nSet Set.new(List keys) => keys.foldl(%{},\n  %!(Map set, Var key) => set.update_n(1, key, (Var) 1));\n\n// Connect add and mul to the + and * operators.\nprotocol Map(T) { T T.add(T, T); T T.mul(T, T); }\nprotocol Map(Set);\n","program":false,"visible":"#include \u003cassert.h>\n// Reuse Map storage: its keys are the set members.\ntypedef Map Set;\n\nint main(void) {\n  // Create two sets, then take their union and intersection.\n  Set fruit = Set.new(%(apple pear));\n  Set lunch = Set.new(%(pear bread));\n  Set set_union = fruit + lunch;\n  Set intersection = fruit * lunch;\n  assert(set_union.len() == 3 && set_union.contains(\u003capple>) &&\n         set_union.contains(\u003cpear>) && set_union.contains(\u003cbread>));\n  assert(fruit.len() == 2 && lunch.len() == 2);\n  assert(Set.new(nil).len() == 0);\n  assert(Set.new(%(apple pear apple)).len() == 2);\n  Set symbols = Set.new(%(apple pear));\n  assert(symbols.contains(\u003capple>) && symbols.contains(\u003cpear>));\n  assert(intersection.len() == 1 && intersection.contains(\u003cpear>));\n  assert((fruit * fruit).len() == 2);\n  assert((fruit * Set.new(nil)).len() == 0);\n  assert((Set.new(nil) * fruit).len() == 0);\n  assert(fruit.len() == 2 && lunch.len() == 2);\n  printf(\"%d in the union, %d in both\\n\", set_union.len(), intersection.len());\n  return 0;\n}\n\nSet Set.add(Set left, Set right) => left.copy().merge(right);\nSet Set.mul(Set left, Set right) => Set.new(left.keys()\n  .filter(%!(Var key) => key in right));\nSet Set.new(List keys) => keys.foldl(%{},\n  %!(Map set, Var key) => set.update_n(1, key, (Var) 1));\n\n// Connect add and mul to the + and * operators.\nprotocol Map(T) { T T.add(T, T); T T.mul(T, T); }\nprotocol Map(Set);","slug":"protocols","label":"power / protocols"},{"id":"power/iterators","source":"/*  iterators.x -- lazy selection, merging, and validation */\n\nint main(void) {\n  auto {\n    List seen = %(3 1 3 2 1 4);\n    printf(\"unique: %s\\n\", seen.iter().unique().list().repr());\n\n    List urgent = %(101 102), routine = %(201 202 203);\n    printf(\"queue: %s\\n\", urgent.iter()\n      .chain(routine.iter()).head(4).list().repr());\n\n    printf(\"first square over threshold: %d\\n\", range(1, 20, 1)\n      .map(%!(value) => value * value)\n      .find(%!(value) => value > 70).int());\n\n    List temperatures = %(71 106 98 112 87);\n    printf(\"temperature alerts: %d\\n\", temperatures.iter()\n      .filter(%!(value) => value > 100).count());\n    printf(\"temperature warning: %s\\n\", temperatures.iter()\n      .any(%!(value) => value > 110) ? \"yes\" : \"no\");\n\n    List scores = %(91 88 100 73);\n    printf(\"scores valid: %s\\n\", scores.iter()\n      .all(%!(score) => score >= 0 && score \u003c= 100) ? \"yes\" : \"no\");\n\n    printf(\"numbered: %s\\n\", %(\u003cparse> \u003ccompile> \u003clink>).iter()\n      .enumerate(1).list().repr());\n  }\n  return 0;\n}\n","program":false,"visible":"/*  iterators.x -- lazy selection, merging, and validation */\n\nint main(void) {\n  auto {\n    List seen = %(3 1 3 2 1 4);\n    printf(\"unique: %s\\n\", seen.iter().unique().list().repr());\n\n    List urgent = %(101 102), routine = %(201 202 203);\n    printf(\"queue: %s\\n\", urgent.iter()\n      .chain(routine.iter()).head(4).list().repr());\n\n    printf(\"first square over threshold: %d\\n\", range(1, 20, 1)\n      .map(%!(value) => value * value)\n      .find(%!(value) => value > 70).int());\n\n    List temperatures = %(71 106 98 112 87);\n    printf(\"temperature alerts: %d\\n\", temperatures.iter()\n      .filter(%!(value) => value > 100).count());\n    printf(\"temperature warning: %s\\n\", temperatures.iter()\n      .any(%!(value) => value > 110) ? \"yes\" : \"no\");\n\n    List scores = %(91 88 100 73);\n    printf(\"scores valid: %s\\n\", scores.iter()\n      .all(%!(score) => score >= 0 && score \u003c= 100) ? \"yes\" : \"no\");\n\n    printf(\"numbered: %s\\n\", %(\u003cparse> \u003ccompile> \u003clink>).iter()\n      .enumerate(1).list().repr());\n  }\n  return 0;\n}","slug":"iterators","label":"power / iterators"},{"id":"power/derive","source":"/*  derive.x -- record mapping, representation, and nested equality */\n#include \u003cderive.x>\n\ntypedef struct Point { int x, y; } Point;\ntypedef struct Person {\n  int age;\n  String name;\n  double score;\n  Point home;\n  Array tags;\n} Person;\n\n$derive(Point, \u003cmap>, \u003cequal>, \u003crepr>);\n$derive(Person, \u003cjson>, \u003cequal>, \u003crepr>);\n\nint main(void) {\n  Person p = { 42, \"Ada\", 1.5, { 3, 4 }, [\"x\", 2] };\n  Map m = p.to_map();\n  Map home = m[\"home\"];\n  printf(\"map age=%s name=%s score=%s home=(%s, %s) tags=%s\\n\",\n         m[\"age\"], m[\"name\"], m[\"score\"], home[\"x\"], home[\"y\"], m[\"tags\"]);\n  Person q = Person.from_map(m);\n  printf(\"%s\\n\", q.repr().str());\n  printf(\"equal %d\\n\", p.equal(q));\n  q.home.y = 9;\n  printf(\"equal %d %s\\n\", p.equal(q), q.repr().str());\n  return 0;\n}\n","program":false,"visible":"/*  derive.x -- record mapping, representation, and nested equality */\n#include \u003cderive.x>\n\ntypedef struct Point { int x, y; } Point;\ntypedef struct Person {\n  int age;\n  String name;\n  double score;\n  Point home;\n  Array tags;\n} Person;\n\n$derive(Point, \u003cmap>, \u003cequal>, \u003crepr>);\n$derive(Person, \u003cjson>, \u003cequal>, \u003crepr>);\n\nint main(void) {\n  Person p = { 42, \"Ada\", 1.5, { 3, 4 }, [\"x\", 2] };\n  Map m = p.to_map();\n  Map home = m[\"home\"];\n  printf(\"map age=%s name=%s score=%s home=(%s, %s) tags=%s\\n\",\n         m[\"age\"], m[\"name\"], m[\"score\"], home[\"x\"], home[\"y\"], m[\"tags\"]);\n  Person q = Person.from_map(m);\n  printf(\"%s\\n\", q.repr().str());\n  printf(\"equal %d\\n\", p.equal(q));\n  q.home.y = 9;\n  printf(\"equal %d %s\\n\", p.equal(q), q.repr().str());\n  return 0;\n}","slug":"derive","label":"power / derive"},{"id":"magic/fields","source":"#include \"meta.x\"\n\ntypedef struct Reading { int celsius; String station; int gusts; } Reading;\n\n// The compiler hands a meta function the fields of a struct type.\nmeta static List show_fields(List receiver, TypeInfo type) {\n  Array lines = [];\n  foreach (List field in type.assoc(\u003cfields>)) {\n    String name = field.car();\n    List label = $!String{ $name };\n    lines.push($!Stmt{ printf(\"%s = %s\\n\", $label, (Var) $receiver.$name); });\n  }\n  return $!Stmt{ { @(lines.list_free()) } };\n}\n\n// The macro captures the expression; the meta function writes the code.\nmacro Stmt $show(Expr $value) => $show_fields($value, $value);\n\nint main(void) {\n  Reading noon = { 21, \"roof\", 12 };\n  $show(noon);\n  return 0;\n}\n","program":false,"visible":"#include \"meta.x\"\n\ntypedef struct Reading { int celsius; String station; int gusts; } Reading;\n\n// The compiler hands a meta function the fields of a struct type.\nmeta static List show_fields(List receiver, TypeInfo type) {\n  Array lines = [];\n  foreach (List field in type.assoc(\u003cfields>)) {\n    String name = field.car();\n    List label = $!String{ $name };\n    lines.push($!Stmt{ printf(\"%s = %s\\n\", $label, (Var) $receiver.$name); });\n  }\n  return $!Stmt{ { @(lines.list_free()) } };\n}\n\n// The macro captures the expression; the meta function writes the code.\nmacro Stmt $show(Expr $value) => $show_fields($value, $value);\n\nint main(void) {\n  Reading noon = { 21, \"roof\", 12 };\n  $show(noon);\n  return 0;\n}","slug":"fields","label":"magic / fields"}]</script></section><footer class="landing-footer"><a href="/" class="footer-brand"><svg viewBox="0 0 100 100" width="18" height="18" aria-hidden="true"><g fill="none" stroke="#da291c" stroke-width="17" stroke-linecap="butt"><path d="M9 16 A34.5 34.5 0 0 1 9 84"></path><path d="M91 16 A34.5 34.5 0 0 0 91 84"></path></g></svg><span class="x2c-wordmark footer-wordmark">x2c</span></a><p>&cop
